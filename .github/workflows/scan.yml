name: Daily Market AI Scanner

on:
  schedule:
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Upgrade Pip & Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance scikit-learn nltk

      - name: Run Background Scanner
        run: python daily_scanner.py

      - name: Commit top_setups.csv back to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated daily market scan update"
          file_pattern: top_setups.csv
