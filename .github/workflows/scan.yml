name: Daily Market AI Scanner

on:
  schedule:
    - cron: '11 30 * * 1-5' # Runs at 5:00 PM IST (11:30 UTC) Monday-Friday
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas yfinance scikit-learn numpy

      - name: Run Background Scanner
        run: python daily_scanner.py

      - name: Commit top_setups.csv back to repository
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Automated daily market scan update"
          file_pattern: top_setups.csv
